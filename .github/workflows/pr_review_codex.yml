# Reusable Codex Code Review workflow
# Usage: https://docs.github.com/en/actions/using-workflows/reusing-workflows
#
# Example:
#   jobs:
#     review:
#       uses: yetanotherco/actions/.github/workflows/pr_review_codex.yml@main
#       with:
#         custom_prompt: |
#           1. **Security vulnerabilities** - Label by criticality...
#       secrets:
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

name: Codex PR Review

on:
  workflow_call:
    inputs:
      custom_prompt:
        description: 'Review focus; overrides .github/prompts/ai-review.md from the base branch'
        required: false
        type: string
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: true

jobs:
  codex:
    name: Codex Code Review
    # drop-sudo aborts on ubuntu-26.04 (openai/codex-action#188); move back to
    # ubuntu-latest once a codex-action release fixes it.
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      pull-requests: write
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Block fork PRs
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "${{ github.event.issue.pull_request.url }}" --jq '.head.repo.full_name')
          BASE=$(gh api "${{ github.event.issue.pull_request.url }}" --jq '.base.repo.full_name')
          [[ "$HEAD" == "$BASE" ]] || { echo "::error::Fork PR blocked to protect secrets"; exit 1; }

      - name: Load prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PROMPT: ${{ inputs.custom_prompt }}
        run: |
          BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
          if [ -n "$PROMPT" ]; then
            printf '%s\n' "$PROMPT" > /tmp/prompt.md
          elif ! gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" > /tmp/prompt.md 2> /tmp/prompt_error.txt; then
            grep -q 'HTTP 404' /tmp/prompt_error.txt || { cat /tmp/prompt_error.txt; exit 1; }
            ACTIONS_SHA=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq 'first(.referenced_workflows[] | select(.path | startswith("yetanotherco/actions/")) | .sha)')
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/yetanotherco/actions/contents/.github/prompts/ai-review.md?ref=${ACTIONS_SHA:?}" > /tmp/prompt.md
          fi
          DELIM=$(openssl rand -hex 16)
          { echo "prompt<<$DELIM"; cat /tmp/prompt.md; echo "$DELIM"; } >> "$GITHUB_OUTPUT"

      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          PR_DATA=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json baseRefName,headRefOid,baseRefOid)
          echo "base_ref=$(echo $PR_DATA | jq -r '.baseRefName')" >> $GITHUB_OUTPUT
          echo "head_sha=$(echo $PR_DATA | jq -r '.headRefOid')" >> $GITHUB_OUTPUT
          echo "base_sha=$(echo $PR_DATA | jq -r '.baseRefOid')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge

      - name: Pre-fetch base and head refs for the PR
        run: |
          git fetch --no-tags origin \
            ${{ steps.pr.outputs.base_ref }} \
            +refs/pull/${{ steps.pr.outputs.number }}/head

      - name: Run Codex Code Review
        id: codex
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675 # v1.13
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.165.0'
          safety-strategy: drop-sudo
          prompt: |
            You are a code reviewer. Review ONLY the changes in this pull request diff, not the entire codebase.

            This is PR #${{ steps.pr.outputs.number }} for ${{ github.repository }}.
            To see only the PR changes, run:
            git diff ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}

            Focus on:

            ${{ steps.prompt.outputs.prompt }}

            If no issues found, say so briefly.

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## Codex Code Review\n\n${process.env.CODEX_FINAL_MESSAGE}`,
            });
