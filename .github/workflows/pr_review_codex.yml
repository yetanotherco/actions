# Reusable Codex Code Review workflow
# Usage: https://docs.github.com/en/actions/using-workflows/reusing-workflows
#
# Example:
#   jobs:
#     review:
#       uses: yetanotherco/actions/.github/workflows/pr_review_codex.yml@main
#       with:
#         custom_prompt: |
#           1. **Security vulnerabilities** - Label by criticality...
#       secrets:
#         OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

name: Codex PR Review

on:
  workflow_call:
    inputs:
      custom_prompt:
        description: 'Custom review instructions (what to focus on)'
        required: true
        type: string
    secrets:
      OPENAI_API_KEY:
        required: true

jobs:
  codex:
    name: Codex Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}

    steps:
      - name: Get PR details
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER=${{ github.event.pull_request.number || github.event.issue.number }}
          echo "number=$PR_NUMBER" >> $GITHUB_OUTPUT
          PR_DATA=$(gh pr view $PR_NUMBER --repo ${{ github.repository }} --json baseRefName,headRefOid,baseRefOid)
          echo "base_ref=$(echo $PR_DATA | jq -r '.baseRefName')" >> $GITHUB_OUTPUT
          echo "head_sha=$(echo $PR_DATA | jq -r '.headRefOid')" >> $GITHUB_OUTPUT
          echo "base_sha=$(echo $PR_DATA | jq -r '.baseRefOid')" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ steps.pr.outputs.number }}/merge

      - name: Pre-fetch base and head refs for the PR
        run: |
          git fetch --no-tags origin \
            ${{ steps.pr.outputs.base_ref }} \
            +refs/pull/${{ steps.pr.outputs.number }}/head

      - name: Run Codex Code Review
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          safety-strategy: drop-sudo
          prompt: |
            You are a code reviewer. Review ONLY the changes in this pull request diff, not the entire codebase.

            This is PR #${{ steps.pr.outputs.number }} for ${{ github.repository }}.
            To see only the PR changes, run:
            git diff ${{ steps.pr.outputs.base_sha }}...${{ steps.pr.outputs.head_sha }}

            Focus on:

            ${{ inputs.custom_prompt }}

            If no issues found, say so briefly.

  post_feedback:
    runs-on: ubuntu-latest
    needs: codex
    if: needs.codex.outputs.final_message != ''
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Report Codex feedback
        uses: actions/github-script@v7
        env:
          CODEX_FINAL_MESSAGE: ${{ needs.codex.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            const prNumber = context.payload.pull_request?.number || context.payload.issue?.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## Codex Code Review\n\n${process.env.CODEX_FINAL_MESSAGE}`,
            });
