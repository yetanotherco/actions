# Reusable Claude Code Review workflow
# Usage: https://docs.github.com/en/actions/using-workflows/reusing-workflows
#
# Example:
#   jobs:
#     review:
#       uses: yetanotherco/actions/.github/workflows/pr_review_claude.yml@main
#       with:
#         custom_prompt: |
#           1. **Security vulnerabilities** - Label by criticality...
#       secrets:
#         ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

name: Claude PR Review

on:
  workflow_call:
    inputs:
      custom_prompt:
        description: 'Review focus; overrides .github/prompts/ai-review.md from the base branch'
        required: false
        type: string
        default: ''
      model:
        description: 'Claude model to use'
        required: false
        type: string
        default: 'sonnet'
      max_turns:
        description: 'Max turns for Claude'
        required: false
        type: number
        default: 30
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Block fork PRs
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          HEAD=$(gh api "${{ github.event.issue.pull_request.url }}" --jq '.head.repo.full_name')
          BASE=$(gh api "${{ github.event.issue.pull_request.url }}" --jq '.base.repo.full_name')
          [[ "$HEAD" == "$BASE" ]] || { echo "::error::Fork PR blocked to protect secrets"; exit 1; }

      - name: Load prompt
        id: prompt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          PROMPT: ${{ inputs.custom_prompt }}
        run: |
          BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
          if [ -n "$PROMPT" ]; then
            printf '%s\n' "$PROMPT" > /tmp/prompt.md
          elif ! gh api -H 'Accept: application/vnd.github.raw+json' "repos/$GH_REPO/contents/.github/prompts/ai-review.md?ref=$BASE_SHA" > /tmp/prompt.md 2> /tmp/prompt_error.txt; then
            grep -q 'HTTP 404' /tmp/prompt_error.txt || { cat /tmp/prompt_error.txt; exit 1; }
            ACTIONS_SHA=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID" --jq 'first(.referenced_workflows[] | select(.path | startswith("yetanotherco/actions/.github/workflows/pr_review_claude.yml@")) | .sha)')
            gh api -H 'Accept: application/vnd.github.raw+json' "repos/yetanotherco/actions/contents/.github/prompts/ai-review.md?ref=${ACTIONS_SHA:?}" > /tmp/prompt.md
          fi
          DELIM=$(openssl rand -hex 16)
          { echo "prompt<<$DELIM"; cat /tmp/prompt.md; echo "$DELIM"; } >> "$GITHUB_OUTPUT"

      - name: Checkout the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The default checkout is the default branch on issue_comment events,
          # which leaves the code under review absent from the working tree.
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: |
            --model ${{ inputs.model }}
            --max-turns ${{ inputs.max_turns }}
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(cargo tree:*),Bash(cargo metadata:*),Bash(npm list:*),Bash(npm ls:*),Bash(forge inspect:*),Read,Glob,Grep"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}

            Please review this pull request with a focus on:

            ${{ steps.prompt.outputs.prompt }}

            The PR head is checked out in the working directory with full history.

            How to read the PR:
            Run `gh pr diff <PR NUMBER>` for the diff and read it from the command
            output; shell redirection, compound commands and `gh api` are all denied,
            so it cannot be saved to a file. Use Read and Grep on the working tree for
            surrounding context, and `git log`/`git show` for history. The base branch
            ref is not fetched, so `git diff` against it will not resolve.

            How to comment:
            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` to highlight specific code issues.
            Only post GitHub comments - don't submit review text as messages.

            If no issues found, say so briefly.
