name: OpenRouter PR Review

on:
  workflow_call:
    inputs:
      custom_prompt:
        description: 'Custom review instructions (what to focus on)'
        required: true
        type: string
      model:
        description: "OpenRouter model ID, e.g. 'deepseek/deepseek-v4-pro', 'x-ai/grok-4.7' or 'google/gemini-4-argon'"
        required: true
        type: string
      reasoning_effort:
        description: "Reasoning effort: 'none', 'low', 'medium', 'high' or 'xhigh'. OpenRouter maps it to the nearest level the model supports"
        required: false
        type: string
        default: 'medium'
      max_lines:
        description: 'Max lines of diff to review (truncates if larger)'
        required: false
        type: number
        default: 10000
      max_bytes:
        description: 'Max bytes of diff to review, applied after max_lines (sized to the model context window)'
        required: false
        type: number
        default: 1200000
    secrets:
      OPENROUTER_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
      MODEL: ${{ inputs.model }}

    steps:
      - name: Block fork PRs
        run: |
          [ "$(gh pr view "$PR_NUMBER" --json isCrossRepository --jq .isCrossRepository)" = false ] || { echo "::error::Fork PR blocked to protect secrets"; echo "Fork PRs are blocked to protect secrets." > /tmp/error.txt; exit 1; }

      - name: Get PR diff
        env:
          MAX_LINES: ${{ inputs.max_lines }}
          MAX_BYTES: ${{ inputs.max_bytes }}
        run: |
          BASE_SHA=$(gh pr view "$PR_NUMBER" --json baseRefOid --jq .baseRefOid)
          HEAD_SHA=$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)
          MERGE_BASE=$(gh api "repos/$GH_REPO/compare/$BASE_SHA...$HEAD_SHA" --jq .merge_base_commit.sha)
          git init -q "$RUNNER_TEMP/pr"
          cd "$RUNNER_TEMP/pr"
          git remote add origin "$GITHUB_SERVER_URL/$GH_REPO.git"
          git config credential.helper '!gh auth git-credential'
          git fetch -q --filter=blob:none --depth=1 origin "$MERGE_BASE" "$HEAD_SHA"
          git diff "$MERGE_BASE" "$HEAD_SHA" > /tmp/diff.txt
          LC_ALL=C awk -v l="$MAX_LINES" -v b="$MAX_BYTES" '{ n += length($0) + 1 } NR > l || n > b { exit } 1' /tmp/diff.txt > /tmp/diff_sent.txt
          [ -s /tmp/diff_sent.txt ] || { echo "The diff to review is empty" | tee /tmp/error.txt; exit 1; }
          TOTAL=$(wc -l < /tmp/diff.txt) SENT=$(wc -l < /tmp/diff_sent.txt)
          [ "$SENT" -eq "$TOTAL" ] || printf '> Diff truncated from %d to %d lines. Some changes were not reviewed.\n\n' "$TOTAL" "$SENT" > /tmp/note.md

      - name: Call OpenRouter API
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: ${{ inputs.custom_prompt }}
          EFFORT: ${{ inputs.reasoning_effort }}
        run: |
          fail() { echo "$1" | tee /tmp/error.txt; exit 1; }
          [ -n "$OPENROUTER_API_KEY" ] || fail "OPENROUTER_API_KEY secret is not set"
          # data_collection: deny keeps the diff away from providers that may store or train on it.
          # require_parameters: true skips providers that would ignore the reasoning settings.
          jq -n --arg model "$MODEL" --arg effort "$EFFORT" --arg prompt "$PROMPT" --rawfile diff /tmp/diff_sent.txt '{
            model: $model,
            reasoning: { effort: $effort, exclude: true },
            max_tokens: 65536,
            provider: { data_collection: "deny", require_parameters: true },
            messages: [
              { role: "system", content: "You are a code reviewer. Review ONLY the changes in the pull request diff, not the entire codebase.\n\nFocus on:\n\n\($prompt)\n\nIf no issues found, say so briefly." },
              { role: "user", content: "Review this PR diff and provide feedback on any issues found. Be specific about file names and line numbers when possible:\n\nDiff:\n\($diff)" }
            ]
          }' > /tmp/payload.json
          STATUS=$(curl -sS -o /tmp/response.json -w '%{http_code}' https://openrouter.ai/api/v1/chat/completions \
            -H "Authorization: Bearer $OPENROUTER_API_KEY" -H 'Content-Type: application/json' --data-binary @/tmp/payload.json) || fail "OpenRouter API request failed"
          [ "$STATUS" = 200 ] || { echo "Response: $(jq -r '.error.message? // .error // empty' /tmp/response.json | tr '\r\n' '  ' | head -c 300)"; fail "OpenRouter API returned HTTP $STATUS"; }
          # OpenRouter can answer 200 with an error body when the provider fails after the request is accepted.
          if jq -e '.error' /tmp/response.json > /dev/null; then
            echo "Response: $(jq -r '.error.message? // .error' /tmp/response.json | tr '\r\n' '  ' | head -c 300)"
            fail "OpenRouter returned an error (code: $(jq -r '.error.code? // "unknown"' /tmp/response.json))"
          fi
          echo "Served by: $(jq -r '.provider // "unknown"' /tmp/response.json)"
          FINISH=$(jq -r '.choices[0].finish_reason' /tmp/response.json)
          [ "$FINISH" = stop ] || fail "$MODEL did not finish the review (finish_reason: $FINISH)"
          jq -r '.choices[0].message.content // empty' /tmp/response.json > /tmp/review.md
          [ -n "$(tr -d '[:space:]' < /tmp/review.md)" ] || fail "$MODEL returned an empty review"

      - name: Post review
        run: |
          if [ "$(wc -c < /tmp/review.md)" -gt 60000 ]; then
            printf '> Review truncated to 60000 bytes. The full review is in the job log.\n\n' >> /tmp/note.md
            echo '::group::Full review'; cat /tmp/review.md; echo '::endgroup::'
          fi
          { printf '## %s Code Review\n\n' "$MODEL"; cat /tmp/note.md 2>/dev/null || true; head -c 60000 /tmp/review.md; printf '\n\n---\n*Automated review by %s via OpenRouter*\n' "$MODEL"; } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md

      - name: Post error
        if: failure()
        run: |
          printf '## %s Code Review\n\n⚠️ Review failed: %s [Job log](%s)\n' "$MODEL" "$(cat /tmp/error.txt 2>/dev/null || echo 'An unexpected step failed.')" "$GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID" > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md
